<li>
  <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
  <div class="post-meta">
    {{ .Date.Format "2006-01-02" }}
    {{ with .GetTerms "tags" }} · <ul class="tags">{{ range . }}<li><a href="{{ .RelPermalink }}">{{ .LinkTitle | lower }}</a></li>{{ end }}</ul>{{ end }}
  </div>
  <p>{{ with .Description }}{{ . }}{{ else }}{{ .Summary | plainify | truncate 220 }}{{ end }}</p>
</li>

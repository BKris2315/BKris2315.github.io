<footer class="site-footer">
  <div class="wrap">
    <span>© {{ now.Year }} {{ site.Title }}</span>
    <span>
      {{ range $i, $l := site.Params.links }}{{ if $i }} · {{ end }}<a href="{{ $l.url }}">{{ $l.name }}</a>{{ end }}
      · <a href="{{ "blog/index.xml" | relURL }}">RSS</a>
    </span>
  </div>
</footer>
